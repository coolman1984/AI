# FOREMAN Tool Manifest — Passports for existing deterministic engines.
# engine_path format: module::function or module (importable from project root).
# read_only_or_write: read tools NEVER modify data; write tools write ONLY to runs/<id>/ or staging.

- tool_id: T-FP-001
  name: fingerprint_file
  purpose: Compute SHA-256 hash and file size; register a read-only copy.
  engine_path: hashlib
  input_schema:
    path: {type: string, required: true}
  output_schema:
    sha256: string
    size_bytes: integer
    original_path: string
  allowed_file_types: [any]
  read_only_or_write: read
  side_effects: Copies file to datasets/registered/; writes file_fingerprints row.
  risk_level: low
  approval_required: false
  validation_method: SHA-256 matches file content; original unmodified.
  example_call: fingerprint_file("datasets/inbox/actuals.xlsx")

- tool_id: T-ING-001
  name: ingest_spreadsheet
  purpose: Load CSV/Excel text-first into DuckDB with total-row/duplicate quarantine and conservation check.
  engine_path: engines.data.ingest::ingest_spreadsheet
  input_schema:
    path: {type: string, required: true}
    table: {type: string, required: true}
    on_duplicates: {type: string, enum: [flag, drop], default: flag}
    infer_types: {type: boolean, default: false}
  output_schema:
    rows_in: integer
    reject_count: integer
    staging_table: string
  allowed_file_types: [.csv, .xlsx, .xlsm]
  read_only_or_write: write
  side_effects: Creates/replaces DuckDB staging tables; appends ingestion_runs/rejects.
  risk_level: low
  approval_required: false
  validation_method: "conservation: rows_in == kept + rejected (asserted in code + tests)"
  example_call: "ingest_spreadsheet(con, 'raw_actuals', 'datasets/registered/abc123_actuals.xlsx')"
  failure_modes:
    - "file locked by Excel -> tell owner to close it"
    - "unsupported extension -> route to document skills"

- tool_id: T-PROF-001
  name: infer_column_types
  purpose: Profile column names, data types, null percentages, sample values, and suspected key status.
  engine_path: engines.data.types::infer_column_types
  input_schema:
    table: {type: string, required: true}
    max_samples: {type: integer, default: 100}
  output_schema:
    columns: array
  allowed_file_types: []
  read_only_or_write: read
  side_effects: None — reads DuckDB staging only.
  risk_level: low
  approval_required: false
  validation_method: Column count matches DuckDB; each column has dtype, null %, sample.
  example_call: infer_column_types(con, 'raw_actuals')

- tool_id: T-CLEAN-ACT
  name: clean_actuals
  purpose: Parse actuals columns via canonical parser; detect duplicates; quarantine unparseable values.
  engine_path: engines.data.clean::clean_actuals
  input_schema:
    table: {type: string, required: true}
    qty_col: {type: string}
  output_schema:
    clean_table: string
    rejects: integer
  allowed_file_types: []
  read_only_or_write: write
  side_effects: Creates clean DuckDB table; writes reject rows.
  risk_level: low
  approval_required: false
  validation_method: Numeric parsing gate, duplicate gate, conservation check.
  example_call: clean_actuals(con, 'staging_actuals', qty_col='quantity')

- tool_id: T-CLEAN-STD
  name: clean_standards
  purpose: Parse standards/cost-master columns via canonical parser; duplicate and format validation.
  engine_path: engines.data.clean::clean_standards
  input_schema:
    table: {type: string, required: true}
  output_schema:
    clean_table: string
    rejects: integer
  allowed_file_types: []
  read_only_or_write: write
  side_effects: Creates clean DuckDB table; writes reject rows.
  risk_level: low
  approval_required: false
  validation_method: Numeric parsing gate, format validation gate.
  example_call: clean_standards(con, 'staging_standards')

- tool_id: T-PVM-001
  name: price_volume_mix
  purpose: Compute price/volume/mix variance decomposition from actuals and budget.
  engine_path: engines.data.variance::price_volume_mix
  input_schema:
    actuals: {type: string, required: true}
    budget: {type: string, required: true}
  output_schema:
    bridge: object
  allowed_file_types: []
  read_only_or_write: read
  side_effects: None — reads DuckDB clean tables only.
  risk_level: low
  approval_required: false
  validation_method: PVM parts sum to total bridge.
  example_call: price_volume_mix(con, 'clean_actuals', 'budget')

- tool_id: T-DRV-001
  name: run_variance_decomposition
  purpose: Decompose total variance into dimension-level drivers with narrative.
  engine_path: engines.data.drivers::run_variance_decomposition
  input_schema:
    clean_table: {type: string, required: true}
    dimension: {type: string, default: cost_center}
  output_schema:
    drivers: array
  allowed_file_types: []
  read_only_or_write: read
  side_effects: None — reads DuckDB clean tables only.
  risk_level: low
  approval_required: false
  validation_method: Variance bridge reconciles.
  example_call: run_variance_decomposition(con, 'clean_actuals', dimension='cost_center')

- tool_id: T-AUDIT-001
  name: audit_card
  purpose: Recompute and verify report card values; produce sign-off.
  engine_path: engines.audit.audit::audit_card
  input_schema:
    card_data: {type: object, required: true}
  output_schema:
    audit: object
  allowed_file_types: []
  read_only_or_write: read
  side_effects: None
  risk_level: low
  approval_required: false
  validation_method: Recomputation matches original within tolerance.
  example_call: audit_card(con, card_data)

- tool_id: T-CARD-001
  name: make_manager_card
  purpose: Build the manager card data structure from validated numbers.
  engine_path: serving.card::make_manager_card
  input_schema:
    actuals: {type: object, required: true}
    budget: {type: object, required: true}
    period: {type: string, required: true}
  output_schema:
    card: object
  allowed_file_types: []
  read_only_or_write: read
  side_effects: None — data structure construction only.
  risk_level: low
  approval_required: false
  validation_method: Card keys match template; evidence_ids required.
