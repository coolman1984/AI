- tool_id: T-DOC-001
  name: extract_document
  purpose: Extract text/content from PDFs and documents into structured form.
  engine_path: engines.docs.extract::extract_document
  input_schema:
    path: {type: string, required: true}
  output_schema:
    document: object
  allowed_file_types: [.pdf, .docx, .txt]
  read_only_or_write: read
  side_effects: None
  risk_level: low
  approval_required: false
  validation_method: Document structure has required fields.
  example_call: extract_document('datasets/inbox/report.pdf')
  failure_modes:
    - "password-protected PDF -> ask owner to remove password"
