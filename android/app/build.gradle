plugins {
    id "com.android.application"
}

// Release signing: android/keystore.properties (not in git) with storeFile, storePassword,
// keyAlias, keyPassword - see android/README.md
def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) { ksFile.withInputStream { ks.load(it) } }

android {
    namespace "com.mmcore.dashboard"
    compileSdk 36
    defaultConfig {
        applicationId "com.mmcore.dashboard"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks["storeFile"])
                storePassword ks["storePassword"]
                keyAlias ks["keyAlias"]
                keyPassword ks["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) { signingConfig signingConfigs.release }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.android.gms:play-services-code-scanner:16.1.0"
}
