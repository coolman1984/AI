<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MM Core - ERP Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c2b4a'/%3E%3Crect x='6' y='16' width='4' height='10' fill='%2343a6ff'/%3E%3Crect x='12' y='11' width='4' height='15' fill='%2349d17d'/%3E%3Crect x='18' y='7' width='4' height='19' fill='%23ffb547'/%3E%3C/svg%3E">
<style>
:root { --nav: #1c2b4a; --nav2: #24365c; --bg: #eef2f7; --card: #fff; --ink: #1d2a3a; --muted: #6b7787; --line: #e3e8ef;
  --blue: #2f80ed; --green: #27ae60; --orange: #f2994a; --red: #eb5757; --violet: #9b51e0; --teal: #2bb3c0; --yellow: #f2c94c; }
* { box-sizing: border-box; }
body { margin: 0; font: 14px/1.4 "Segoe UI", Roboto, Arial, sans-serif; color: var(--ink); background: var(--bg); }
.app { display: grid; grid-template-columns: 210px 1fr; min-height: 100vh; }
nav { background: linear-gradient(180deg, var(--nav), #14203a); color: #c9d6ea; padding: 14px 0; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 20px 22px; color: #fff; font: 700 22px "Segoe UI", Arial; letter-spacing: .5px; }
.brand i { width: 30px; height: 30px; border-radius: 50%; background: conic-gradient(var(--blue) 0 35%, var(--green) 0 60%, var(--orange) 0 80%, var(--violet) 0); display: inline-block; }
nav a { display: flex; align-items: center; gap: 12px; padding: 11px 22px; color: #c9d6ea; text-decoration: none; font-size: 14px; border-left: 3px solid transparent; }
nav a:hover, nav a.on { background: var(--nav2); color: #fff; border-left-color: var(--blue); }
nav a b { width: 18px; text-align: center; font-weight: 400; opacity: .9; }
nav .foot { position: absolute; bottom: 14px; left: 22px; right: 16px; font-size: 12px; color: #8ea0bd; }
main { padding: 18px 22px 30px; min-width: 0; }
header { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
header h1 { font-size: 26px; margin: 0; font-weight: 600; }
header .sub { color: var(--muted); font-size: 13px; }
header .sp { flex: 1; }
.btn { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 7px 12px; cursor: pointer; font: inherit; color: var(--ink); }
.btn:hover { border-color: var(--blue); color: var(--blue); }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; font-weight: 700; }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.card { background: var(--card); border-radius: 12px; box-shadow: 0 1px 3px rgba(20,40,80,.08), 0 6px 18px rgba(20,40,80,.05); padding: 14px 16px; min-width: 0; cursor: default; }
.card h2 { display: flex; align-items: center; gap: 8px; font-size: 16px; margin: 0 0 10px; font-weight: 600; }
.card h2 .ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; color: #fff; font-size: 12px; }
.card h2 .go { margin-left: auto; font-size: 12px; color: var(--blue); text-decoration: none; font-weight: 400; cursor: pointer; }
.card h2 .pill { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e8f6ee; color: var(--green); font-weight: 600; }
.span2 { grid-column: span 2; } .row2 { grid-row: span 2; }
.big { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
.lbl { color: var(--muted); font-size: 12px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.kpi .v { font-size: 20px; font-weight: 700; } .kpi .v.neg { color: var(--red); } .kpi .v.pos { color: var(--green); }
.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; } .tile b { display: block; font-size: 17px; } .tile span { font-size: 11px; color: var(--muted); }
.legend { list-style: none; padding: 0; margin: 0; font-size: 13px; } .legend li { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
.legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; } .legend em { margin-left: auto; font-style: normal; font-weight: 600; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: center; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; } th { text-align: left; color: var(--muted); font-weight: 500; padding: 4px 2px; border-bottom: 1px solid var(--line); }
td { padding: 5px 2px; border-bottom: 1px solid #f1f4f8; } td.n { text-align: right; font-variant-numeric: tabular-nums; } td.neg { color: var(--red); }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; background: #eef4ff; color: var(--blue); }
.task { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
.task:hover { border-color: var(--blue); } .task .dot { width: 26px; height: 26px; border-radius: 6px; flex: none; display: grid; place-items: center; color: #fff; font-size: 12px; }
.task small { display: block; color: var(--muted); }
svg { display: block; width: 100%; height: auto; } svg text { font: 11px "Segoe UI", Arial; fill: var(--muted); }
.err { background: #fff3f3; border: 1px solid #f3c5c5; color: #a12; padding: 12px; border-radius: 10px; margin-bottom: 12px; }
.muted { color: var(--muted); }
@media (max-width: 1350px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 1000px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .app { grid-template-columns: 1fr; } nav { display: none; } }
@media (max-width: 640px) { .grid { grid-template-columns: 1fr; } .span2 { grid-column: span 1; } }
</style>
</head>
<body>
<div class="app">
  <nav>
    <div class="brand"><i></i> MM Core</div>
    <a href="#finance" class="on"><b>▤</b> Finance</a>
    <a href="#manufacturing"><b>⚙</b> Manufacturing</a>
    <a href="#warehouse"><b>▦</b> Warehouse</a>
    <a href="#quality"><b>✓</b> Quality</a>
    <a href="#procurement"><b>⛟</b> Procurement</a>
    <a href="#sales"><b>☎</b> Sales &amp; CRM</a>
    <a href="#hr"><b>☺</b> HR</a>
    <a href="#controlling"><b>◔</b> Controlling</a>
    <a href="#analytics"><b>↗</b> Analytics</a>
    <a href="#tasks"><b>☑</b> Tasks</a>
    <a href="/" target="_blank" data-ext="1"><b>⚑</b> Open MM Core</a>
    <div class="foot" id="foot"></div>
  </nav>
  <main>
    <header>
      <div><h1>ERP Dashboard</h1><div class="sub" id="sub">Loading ...</div></div>
      <span class="sp"></span>
      <select class="btn" id="cur" title="Display currency" aria-label="Display currency">
        <option value="EGP">EGP</option><option value="USD">USD</option><option value="EUR">EUR</option></select>
      <button class="btn" id="refresh" type="button" title="Refresh (F5)">⟳ Refresh</button>
      <button class="btn" id="bi" type="button">BI reports</button>
      <div class="avatar" id="avatar" title="User">--</div>
    </header>
    <div id="err"></div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<script src="/dashboard.js"></script>
</body>
</html>
